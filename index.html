<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HeimdalL - Thor MIR4 EU</title>
  <meta property="og:title" content="Thor MIR4 EU">
  <meta property="og:image" content="thor-mir4.jpg">
  <style>
    :root {
      --bg: #070b18;
      --text: #f2f5ff;
      --muted: #b4bddb;
      --discord: #5865f2;
      --register: #e11d2e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      isolation: isolate;
    }
    /* Blurred copy of the artwork fills the whole screen behind the card */
    body::before {
      content: "";
      position: fixed;
      inset: -40px;
      z-index: -2;
      background: url("thor-mir4-bg.jpg") center / cover no-repeat;
      filter: blur(18px) brightness(.45);
    }
    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .art {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    }
    h1 { font-size: 1.6rem; margin: 22px 0 4px; }
    p { margin: 0 0 22px; color: var(--muted); }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 15px 18px;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      background: var(--discord);
    }
    a.btn.register { background: var(--register); }
    a.btn:hover, a.btn:focus-visible { filter: brightness(1.15); outline: none; }
    a.btn:focus-visible { box-shadow: 0 0 0 3px #fff; }
  </style>
</head>
<body>
  <main>
    <img class="art" src="thor-mir4.jpg" alt="Thor MIR4 EU official Discord server artwork" width="1000" height="1000">
    <h1>HeimdalL</h1>
    <p>Thor MIR4 EU server</p>
    <div class="buttons">
      <a class="btn" href="https://discord.gg/CdbTdVzS">Join the Discord</a>
      <a class="btn register" href="https://account.thormir.com/register.html?ref=1020">Register your account now</a>
    </div>
  </main>
</body>
</html>
